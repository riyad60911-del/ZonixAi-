<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonixAi - AI Voice Generator</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-6 space-y-6">
        <h1 class="text-3xl font-bold text-center text-teal-400">ZonixAi</h1>
        <p class="text-gray-400 text-center text-sm">ফ্রি ওপেন-সোর্স এআই ভয়েস জেনারেটর</p>
        
        <div>
            <label class="block text-sm font-medium mb-2">আপনার টেক্সট লিখুন:</label>
            <textarea id="text-input" rows="4" class="w-full p-3 bg-gray-700 rounded-lg text-white border border-gray-600 focus:outline-none focus:border-teal-400" placeholder="এখানে যা লিখবেন তা ভয়েস হয়ে যাবে..."></textarea>
        </div>

        <button id="generate-btn" class="w-full bg-teal-500 hover:bg-teal-600 font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center space-x-2">
            <span>ভয়েস তৈরি করুন</span>
        </button>

        <div id="audio-container" class="hidden space-y-2">
            <label class="block text-sm font-medium">আপনার অডিও রেডি:</label>
            <audio id="audio-player" controls class="w-full"></audio>
        </div>
    </div>

    <script>
        const HF_TOKEN = "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";
        
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const text = document.getElementById('text-input').value;
            const btn = document.getElementById('generate-btn');
            const audioContainer = document.getElementById('audio-container');
            const audioPlayer = document.getElementById('audio-player');
            
            if(!text) return alert("দয়া করে কিছু টেক্সট লিখুন!");
            
            btn.disabled = true;
            btn.innerText = "ভয়েস তৈরি হচ্ছে...";
            
            try {
                const response = await fetch("https://huggingface.co", {
                    headers: { Authorization: `Bearer ${HF_TOKEN}` },
                    method: "POST",
                    body: JSON.stringify({ inputs: text }),
                });
                
                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                audioPlayer.src = audioUrl;
                audioContainer.classList.remove('hidden');
            } catch (error) {
                alert("দুঃখিত, কোনো সমস্যা হয়েছে! আবার চেষ্টা করুন।");
            } finally {
                btn.disabled = false;
                btn.innerText = "ভয়েস তৈরি করুন";
            }
        });
    </script>
</body>
</html>
