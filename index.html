<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonixAi - AI Voice Generator Pro</title>
    <style>
        body {
            background-color: #111827;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1f2937;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            padding: 28px;
            box-sizing: border-box;
        }
        h1 {
            color: #2dd4bf;
            text-align: center;
            margin: 0 0 5px 0;
            font-size: 2.2rem;
        }
        .subtitle {
            color: #9ca3af;
            text-align: center;
            font-size: 0.875rem;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: #e5e7eb;
        }
        textarea {
            width: 100%;
            padding: 14px;
            background-color: #374151;
            color: #ffffff;
            border: 1px solid #4b5563;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #2dd4bf;
        }
        .counter {
            text-align: right;
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 4px;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 12px;
            background-color: #374151;
            color: #ffffff;
            border: 1px solid #4b5563;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slider-val {
            font-size: 0.875rem;
            color: #2dd4bf;
            min-width: 35px;
        }
        button {
            width: 100%;
            background-color: #14b8a6;
            color: #ffffff;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0d9488;
        }
        button:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }
        .download-btn {
            background-color: #3b82f6;
            margin-top: 10px;
        }
        .download-btn:hover {
            background-color: #2563eb;
        }
        .audio-section {
            margin-top: 24px;
            background-color: #374151;
            padding: 18px;
            border-radius: 8px;
            border: 1px dashed #4b5563;
        }
        audio {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 5px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZonixAi</h1>
        <div class="subtitle">প্রো এআই ভয়েস জেনারেটর (ফ্রি এডিশন)</div>
        
        <div class="form-group">
            <label for="text-input">আপনার টেক্সট লিখুন:</label>
            <textarea id="text-input" rows="4" placeholder="এখানে যা লিখবেন তা ভয়েস হয়ে যাবে..."></textarea>
            <div class="counter"><span id="char-count">0</span> অক্ষর</div>
        </div>

        <div class="form-group">
            <label for="voice-select">ভয়েস ক্যারেক্টার সিলেক্ট করুন:</label>
            <select id="voice-select">
                <option value="bn-BD">বাংলা এআই ক্যারেক্টার (Default)</option>
                <option value="bn-IN">বাংলা প্রিমিয়াম অ্যাকসেন্ট</option>
            </select>
        </div>

        <div class="form-group">
            <label for="speed-slider">ভয়েস স্পীড (গতি):</label>
            <div class="slider-container">
                <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0">
                <span id="speed-val" class="slider-val">1.0x</span>
            </div>
        </div>

        <button id="generate-btn">ভয়েস তৈরি করুন</button>

        <div id="audio-container" class="audio-section hidden">
            <label>আপনার অডিও প্রস্তুত:</label>
            <audio id="audio-player" controls></audio>
            <button id="download-btn" class="download-btn">অডিও ডাউনলোড করুন</button>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const charCount = document.getElementById('char-count');
        const speedSlider = document.getElementById('speed-slider');
        const speedVal = document.getElementById('speed-val');
        const voiceSelect = document.getElementById('voice-select');
        const audioContainer = document.getElementById('audio-container');
        const audioPlayer = document.getElementById('audio-player');
        const btn = document.getElementById('generate-btn');

        // ক্যারেক্টার কাউন্টার রিয়েল-টাইম আপডেট
        textInput.addEventListener('input', () => {
            charCount.innerText = textInput.value.length;
        });

        // স্পীড স্লাইডার টেক্সট আপডেট
        speedSlider.addEventListener('input', () => {
            speedVal.innerText = speedSlider.value + 'x';
        });

        btn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if(!text) {
                alert("দয়া করে কিছু টেক্সট লিখুন!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "ভয়েস তৈরি হচ্ছে...";
            audioContainer.classList.add('hidden');

            try {
                const lang = voiceSelect.value;
                const speed = speedSlider.value;
                
                // সুপার ফাস্ট এবং হাই-স্ট্যাবিলিটি এপিআই গেটওয়ে
                const ttsUrl = `https://google.com{lang}&client=tw-ob&ttsspeed=${speed}&q=${encodeURIComponent(text)}`;
                
                audioPlayer.src = ttsUrl;
                
                // অডিও লোড হওয়া নিশ্চিত করা
                audioPlayer.load();
                
                audioContainer.classList.remove('hidden');
            } catch (error) {
                alert("দুঃখিত, আবার চেষ্টা করুন।");
            } finally {
                btn.disabled = false;
                btn.innerText = "ভয়েস তৈরি করুন";
            }
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            const text = textInput.value.trim();
            if(text) {
                const lang = voiceSelect.value;
                const speed = speedSlider.value;
                const downloadUrl = `https://google.com{lang}&client=tw-ob&ttsspeed=${speed}&q=${encodeURIComponent(text)}`;
                
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = 'zonixai-voice.mp3';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });
    </script>
</body>
</html>
