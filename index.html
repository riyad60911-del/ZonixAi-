<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonixAi - AI Voice Generator</title>
    <style>
        body {
            background-color: #111827;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background-color: #1f2937;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            padding: 24px;
            box-sizing: border-box;
        }
        h1 {
            color: #2dd4bf;
            text-align: center;
            margin: 0 0 5px 0;
            font-size: 2rem;
        }
        .subtitle {
            color: #9ca3af;
            text-align: center;
            font-size: 0.875rem;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            background-color: #374151;
            color: #ffffff;
            border: 1px solid #4b5563;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #2dd4bf;
        }
        button {
            width: 100%;
            background-color: #14b8a6;
            color: #ffffff;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0d9488;
        }
        button:disabled {
            background-color: #4b5563;
            cursor: not-allowed;
        }
        .download-btn {
            background-color: #3b82f6;
        }
        .download-btn:hover {
            background-color: #2563eb;
        }
        .audio-section {
            margin-top: 24px;
            background-color: #374151;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #4b5563;
        }
        audio {
            width: 100%;
            margin-top: 8px;
            margin-bottom: 12px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZonixAi</h1>
        <div class="subtitle">ফ্রি ওপেন-সোর্স এআই ভয়েস জেনারেটর</div>
        
        <div class="form-group">
            <label for="text-input">আপনার টেক্সট লিখুন:</label>
            <textarea id="text-input" rows="4" placeholder="এখানে যা লিখবেন তা ভয়েস হয়ে যাবে..."></textarea>
        </div>

        <button id="generate-btn">ভয়েস তৈরি করুন</button>

        <div id="audio-container" class="audio-section hidden">
            <label>Your Audio is Ready:</label>
            <audio id="audio-player" controls></audio>
            <button id="download-btn" class="download-btn">অডিও ডাউনলোড করুন</button>
        </div>
    </div>

    <script>
        let currentBlobUrl = null;

        document.getElementById('generate-btn').addEventListener('click', async () => {
            const text = document.getElementById('text-input').value.trim();
            const btn = document.getElementById('generate-btn');
            const audioContainer = document.getElementById('audio-container');
            const audioPlayer = document.getElementById('audio-player');
            
            if(!text) {
                alert("দয়া করে কিছু টেক্সট লিখুন!");
                return;
            }
            
            btn.disabled = true;
            btn.innerText = "ভয়েস তৈরি হচ্ছে...";
            audioContainer.classList.add('hidden');
            
            try {
                // নতুন দ্রুতগতির ফ্রি পাবলিক API ব্যবহার করা হয়েছে যা ২৪ ঘণ্টা সচল থাকে
                const response = await fetch(`https://google.com{encodeURIComponent(text)}`);
                
                if (!response.ok) throw new Error("TTS failed");
                
                const blob = await response.blob();
                
                if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
                
                currentBlobUrl = URL.createObjectURL(blob);
                audioPlayer.src = currentBlobUrl;
                audioContainer.classList.remove('hidden');
            } catch (error) {
                alert("দুঃখিত, সার্ভার ওভারলোড হয়েছে! দয়া করে আবার বাটনটি চাপুন।");
            } finally {
                btn.disabled = false;
                btn.innerText = "ভয়েস তৈরি করুন";
            }
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            if (currentBlobUrl) {
                const a = document.createElement('a');
                a.href = currentBlobUrl;
                a.download = 'zonixai-voice.mp3';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });
    </script>
</body>
</html>
